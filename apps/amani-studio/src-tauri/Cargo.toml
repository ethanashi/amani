[package]
name = "amani-studio"
version = "0.1.0"
description = "Amani desktop research workspace"
authors = ["Amani"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = "3"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
# Independent minimal implementation: remove the only MPL runtime dependency.
option-ext = { path = "vendor/option-ext" }
