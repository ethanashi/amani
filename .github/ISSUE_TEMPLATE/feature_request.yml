name: Feature request
description: Suggest a change or an addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: checker
    attributes:
      label: Effect on the checker
      description: Would this make a gate easier to pass, change a label, or let a model see a trusted path? If so, say why that is safe.
  - type: input
    id: package
    attributes:
      label: Package
